<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generator Link Undangan Nayra</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fdf3dc;--card:#fff;--ink:#3b2412;--red:#c8372d;--yellow:#f6c343;--line:#d9b98a;--mut:#7a6350}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241710;--card:#33231a;--ink:#f6e8d2;--red:#ef6a5e;--yellow:#f6c343;--line:#6b4e36;--mut:#bfa98e}}
:root[data-theme="dark"]{--bg:#241710;--card:#33231a;--ink:#f6e8d2;--red:#ef6a5e;--yellow:#f6c343;--line:#6b4e36;--mut:#bfa98e}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:20px 16px}
.box{width:100%;max-width:460px}
h1{font-size:1.5rem;margin:6px 0 4px;color:var(--red)}
p.s{margin:0 0 18px;color:var(--mut);font-size:.92rem}
.card{background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:16px}
label{display:block;font-weight:700;font-size:.9rem;margin:12px 0 5px}label:first-child{margin-top:0}
input{width:100%;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
input:focus{outline:3px solid var(--yellow);outline-offset:0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button,a.b{appearance:none;border:0;border-radius:999px;padding:12px 16px;font:inherit;font-weight:700;font-size:.95rem;cursor:pointer;text-decoration:none;display:inline-block;color:#fff;background:var(--red)}
button.y{background:var(--yellow);color:#3b2412}
button.g{background:transparent;color:var(--ink);border:2px solid var(--line);padding:6px 12px;font-size:.85rem}
h2{font-size:1rem;margin:22px 0 6px}
.h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dotted var(--line)}
.h span{word-break:break-word}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;font-size:.9rem}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="box">
  <h1>Buat Link Tamu 🎈</h1>
  <p class="s">Ketik nama penerima, link undangan jadi otomatis. Tinggal salin.</p>
  <div class="card">
    <label for="n">Nama penerima</label>
    <input id="n" maxlength="40" placeholder="mis. Budi Santoso" autocomplete="off">
    <label for="l">Link undangan</label>
    <input id="l" readonly>
    <div class="row">
      <button class="y" id="cl">📋 Salin Link</button>
      <button id="cm">💬 Salin Pesan</button>
      <a class="b" id="wa" target="_blank" rel="noopener">WhatsApp</a>
    </div>
  </div>
  <h2>Riwayat nama</h2>
  <div id="hist"></div>
</div>
<div class="toast" id="t"></div>
<script>
// Alamat undangan otomatis ikut domain tempat halaman ini dibuka
const BASE=location.protocol.indexOf("http")===0?location.origin+"/":"https://undangan-nayra.vercel.app/";
const $=id=>document.getElementById(id);
const mk=n=>{n=n.trim();return BASE+(n?"?to="+encodeURIComponent(n).replace(/%20/g,"+"):"")};
const msg=(n,l)=>`Halo ${n||"teman"}, kamu diundang ke ulang tahun ke-2 Nayra 🤠🎈\n\nMinggu, 8 November 2026 · pukul 15:00 WIB\nBurger King Buah Batu, Bandung\n\nBuka undangannya di sini:\n${l}`;
const toast=m=>{const e=$("t");e.textContent=m;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2000)};
function getH(){try{return JSON.parse(localStorage.getItem("nayra-hist")||"[]")}catch(e){return[]}}
function remember(n){n=n.trim();if(!n)return;try{const h=getH().filter(x=>x!==n);h.unshift(n);localStorage.setItem("nayra-hist",JSON.stringify(h.slice(0,40)))}catch(e){}draw()}
async function copy(t,m){
  let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true}catch(e){}
  if(!ok){const a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.focus();a.select();try{ok=document.execCommand("copy")}catch(e){}a.remove()}
  toast(ok?m:"Gagal menyalin, tekan lama pada kolom link")}
function upd(){const n=$("n").value,l=mk(n);$("l").value=l;$("wa").href="https://wa.me/?text="+encodeURIComponent(msg(n.trim(),l))}
function draw(){const el=$("hist");el.textContent="";const h=getH();
  if(!h.length){el.textContent="Belum ada.";return}
  h.forEach(n=>{const r=document.createElement("div");r.className="h";const s=document.createElement("span");s.textContent=n;
    const b=document.createElement("button");b.className="g";b.textContent="Salin";b.onclick=()=>copy(mk(n),"Link "+n+" disalin ✅");r.append(s,b);el.appendChild(r)})}
$("n").oninput=upd;
$("cl").onclick=()=>{remember($("n").value);copy($("l").value,"Link disalin ✅")};
$("cm").onclick=()=>{const n=$("n").value.trim();remember(n);copy(msg(n,mk(n)),"Pesan disalin ✅")};
$("wa").onclick=()=>remember($("n").value);
upd();draw();
</script>
</body>
</html>
